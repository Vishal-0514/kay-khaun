# Builds the Android test app (APK) on GitHub's machines instead of Expo's
# servers, so it doesn't use the Expo plan's monthly builds. Same "preview"
# settings and the same signing key as Expo builds (fetched from Expo with
# EXPO_TOKEN), so it installs over the current app and Google sign-in works.
#
# Run it: GitHub → Actions → "Android APK" → Run workflow. When it finishes
# (about 20–30 min), download "kya-khaun-apk" from the run's Artifacts.
# Needs the repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a release (share link)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check the Expo token is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret first (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - run: npm ci

      - name: Build the APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Phones only need 64-bit ARM; building one CPU type instead of four
          # cuts the native compile time to about a quarter.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: npx --yes eas-cli@latest build --platform android --profile preview --local --non-interactive --output "$GITHUB_WORKSPACE/kya-khaun.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kya-khaun-apk
          path: kya-khaun.apk
          retention-days: 14

      # A plain download link to send friends (like the Expo build link):
      # each run becomes a GitHub release with the APK attached.
      - name: Make a share link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="test-${{ github.run_number }}"
          gh release create "$tag" "$GITHUB_WORKSPACE/kya-khaun.apk" \
            --prerelease --title "Kya Khaun test build ${{ github.run_number }}" \
            --notes "Android test app. Open this page on the phone, tap kya-khaun.apk, then install."
          link="https://github.com/${{ github.repository }}/releases/download/$tag/kya-khaun.apk"
          echo "### Share link" >> "$GITHUB_STEP_SUMMARY"
          echo "$link" >> "$GITHUB_STEP_SUMMARY"
          echo "Latest build, always: https://github.com/${{ github.repository }}/releases" >> "$GITHUB_STEP_SUMMARY"
