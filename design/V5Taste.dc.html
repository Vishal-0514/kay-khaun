<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kya Khaun — Your taste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
a{color:#2B0F0B}a:hover{color:#C8161D}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFBF4; font-family: 'Figtree', system-ui, sans-serif; color: #2B0F0B">

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 232px; background: radial-gradient(120% 90% at 88% -10%, #9A1F22 0%, #5C0A0F 50%, #3A0508 100%); overflow: hidden; border-radius: 0 0 32px 32px; "><svg width="390" height="900" style="position: absolute; left: 0; top: 0; -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.5) 55%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.5) 55%, transparent 100%);" aria-hidden="true">
    <defs><pattern id="jl2" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M18 3C25 11 25 11 33 18C25 25 25 25 18 33C11 25 11 25 3 18C11 11 11 11 18 3Z" fill="none" stroke="#E8A93A" stroke-width="1"/>
      <circle cx="18" cy="18" r="2.2" fill="#E8A93A"/><circle cx="0" cy="0" r="1.6" fill="#E8A93A"/><circle cx="36" cy="0" r="1.6" fill="#E8A93A"/><circle cx="0" cy="36" r="1.6" fill="#E8A93A"/><circle cx="36" cy="36" r="1.6" fill="#E8A93A"/>
    </pattern></defs>
    <rect width="390" height="900" fill="url(#jl2)" opacity="0.16"/>
  </svg></div>
  <div style="position: absolute; left: 24px; right: 24px; top: 16px; display: flex; align-items: center; gap: 16px">
    <a href="V5Welcome.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFF4E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div style="flex: 1; display: flex; gap: 4px" aria-label="Step 2 of 3"><div style="flex: 1; height: 4px; border-radius: 2px; background: #E8A93A"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: #E8A93A"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2)"></div></div>
    <a href="V5Home.dc.html" style="font-size: 15px; font-weight: 600; color: #FFF4E6; text-decoration: underline; text-underline-offset: 4px; padding: 12px 0">Skip</a>
  </div>
  <div style="position: absolute; left: 24px; right: 24px; top: 84px">
    <h1 style="margin: 0; font-family: 'Baloo 2', Georgia, serif; font-weight: 600; font-size: 28px; line-height: 1.15; letter-spacing: -0.01em; color: #FFF4E6">What do you like to eat?</h1>
    <p style="margin: 6px 0 0; font-size: 14px; color: #F3D6C8">The more I know, the fewer questions I'll ask.</p>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; top: 168px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 0 0 1px rgba(43,15,11,0.03), 0 2px 6px rgba(43,15,11,0.05), 0 6px 14px rgba(43,15,11,0.07); border-radius: 28px; padding: 20px 20px 24px">
    <div style="font-family: 'Baloo 2', Georgia, serif; font-weight: 600; font-size: 18px; line-height: 1.25">Diet</div>
    <div style="margin-top: 12px; display: flex; gap: 8px">
      <button onClick="{{ pickVeg }}" aria-pressed="{{ vegSel }}" style="{{ vegStyle }}"><span style="width: 14px; height: 14px; border: 1.5px solid #1E8E3E; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; flex-shrink: 0"><span style="width: 6px; height: 6px; border-radius: 50%; background: #1E8E3E"></span></span> Veg</button>
      <button onClick="{{ pickNonveg }}" aria-pressed="{{ nonvegSel }}" style="{{ nonvegStyle }}"><span style="width: 14px; height: 14px; border: 1.5px solid #8B3A1A; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; flex-shrink: 0"><svg width="8" height="7" viewBox="0 0 8 7" aria-hidden="true"><path d="M4 0l4 7H0z" fill="#8B3A1A"/></svg></span> Non-veg</button>
      <button onClick="{{ pickEgg }}" aria-pressed="{{ eggSel }}" style="{{ eggStyle }}">Egg only</button>
    </div>
    <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: 'Baloo 2', Georgia, serif; font-weight: 600; font-size: 18px; line-height: 1.25">Spice level</span><span style="font-size: 14px; font-weight: 700; color: #C8161D">{{ spiceLabel }}</span></div>
    <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; align-items: end">
      <sc-for list="{{ spice }}" as="s" hint-placeholder-count="5">
        <button onClick="{{ s.pick }}" aria-label="{{ s.label }}" style="height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: flex-end"><span style="{{ s.bar }}"></span></button>
      </sc-for>
    </div>
    <div style="margin-top: 6px; display: flex; justify-content: space-between; font-size: 12px; color: #6E5A52"><span>Mild</span><span>Extra hot</span></div>
    <div style="margin-top: 20px; font-family: 'Baloo 2', Georgia, serif; font-weight: 600; font-size: 18px; line-height: 1.25">Favourite cuisines</div>
    <div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{ cuisines }}" as="c" hint-placeholder-count="7">
        <button onClick="{{ c.pick }}" aria-pressed="{{ c.sel }}" style="{{ c.style }}">{{ c.name }}</button>
      </sc-for>
    </div>
    <div style="margin-top: 20px; font-family: 'Baloo 2', Georgia, serif; font-weight: 600; font-size: 18px; line-height: 1.25">Budget per meal</div>
    <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ budgets }}" as="b" hint-placeholder-count="3">
        <button onClick="{{ b.pick }}" aria-pressed="{{ b.sel }}" style="{{ b.style }}">{{ b.label }}</button>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 24px 24px; background: #FFFBF4"><a href="V5Home.dc.html" style="height: 52px; border-radius: 14px; background: #C8161D; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 18px rgba(200,22,29,0.28)">Continue <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { diet: 'nonveg', spice: 3, budget: 'mid', cuisines: ['North Indian', 'Biryani', 'Street food'] };
  }
  renderVals() {
    var self = this, st = this.state;
    var pill = function (on) { return 'height: 44px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; ' + (on ? 'background: #2B0F0B; color: #FFFFFF; border: 1px solid #2B0F0B;' : 'background: #FFFFFF; color: #2B0F0B; border: 1px solid #EFE4D3;'); };
    var labels = ['Mild', 'Light', 'Medium', 'Hot', 'Extra hot'];
    var heat = ['#F2C14E', '#EDA03A', '#E2762E', '#D4442A', '#C8161D'];
    var tints = { 'North Indian': ['#FCEBD0', '#86560F'], 'Biryani': ['#FDE8D6', '#9A3F12'], 'Street food': ['#FDE3E1', '#5C0A0F'], 'Chinese': ['#FBE4EC', '#8E2049'], 'South Indian': ['#E3F2E7', '#1E6B3A'], 'Healthy': ['#E3F2E7', '#1E6B3A'], 'Desserts': ['#FBE4EC', '#8E2049'] };
    return {
      vegStyle: pill(st.diet === 'veg'), nonvegStyle: pill(st.diet === 'nonveg'), eggStyle: pill(st.diet === 'egg'),
      vegSel: st.diet === 'veg', nonvegSel: st.diet === 'nonveg', eggSel: st.diet === 'egg',
      pickVeg: function () { self.setState({ diet: 'veg' }); }, pickNonveg: function () { self.setState({ diet: 'nonveg' }); }, pickEgg: function () { self.setState({ diet: 'egg' }); },
      spiceLabel: labels[st.spice - 1],
      spice: [1, 2, 3, 4, 5].map(function (n) {
        return { label: 'Spice: ' + labels[n - 1], pick: function () { self.setState({ spice: n }); },
          bar: 'display: block; width: 100%; border-radius: 8px; height: ' + (12 + n * 6) + 'px; background: ' + (n <= st.spice ? heat[n - 1] : '#EFE4D3') + ';' + (n === st.spice ? ' box-shadow: 0 4px 10px rgba(200,22,29,0.3);' : '') };
      }),
      cuisines: ["North Indian","Biryani","Street food","Chinese","South Indian","Healthy","Desserts"].map(function (name) {
        var on = st.cuisines.indexOf(name) >= 0, t = tints[name];
        return { name: name, sel: on,
          pick: function () { var l = self.state.cuisines.slice(), k = l.indexOf(name); if (k >= 0) l.splice(k, 1); else l.push(name); self.setState({ cuisines: l }); },
          style: 'height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; ' + (on ? 'font-weight: 700; background: ' + t[0] + '; color: ' + t[1] + '; border: 1.5px solid ' + t[1] + ';' : 'font-weight: 500; background: #FFFFFF; color: #2B0F0B; border: 1px solid #EFE4D3;') };
      }),
      budgets: [['low', 'Under ₹300'], ['mid', '₹300–500'], ['high', '₹500+']].map(function (b) {
        var on = st.budget === b[0];
        return { label: b[1], sel: on, pick: function () { self.setState({ budget: b[0] }); },
          style: 'height: 48px; border-radius: 14px; font-size: 15px; font-weight: 600; ' + (on ? 'background: #FCF1DA; color: #86560F; border: 1.5px solid #E8A93A;' : 'background: #FFFFFF; color: #2B0F0B; border: 1px solid #EFE4D3;') };
      })
    };
  }
}
</script>
</body>
</html>
