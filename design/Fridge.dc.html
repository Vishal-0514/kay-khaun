<!doctype html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8">
<title>Kya Khaun — Fridge scan</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#8E0E14}a:hover{color:#C8161D}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #160604; font-family: 'Figtree', sans-serif; color: #FFF6E5">

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 520px; background: #241210; display: flex; align-items: center; justify-content: center">
    <span style="font-size: 13px; font-weight: 600; color: #7A5A50; letter-spacing: 0.06em">[ LIVE CAMERA VIEW ]</span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 20px; display: flex; align-items: center; gap: 12px">
    <a href="Chat.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: rgba(22,6,4,0.7); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFF6E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span style="flex: 1; font-family: 'Baloo 2', sans-serif; font-size: 22px; font-weight: 800">Fridge dikhao</span>
    <button aria-label="Flash" style="width: 44px; height: 44px; border-radius: 14px; border: none; background: rgba(22,6,4,0.7); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4B740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
    </button>
  </div>

  <div style="position: absolute; left: 30px; top: 92px; width: 330px; height: 340px" aria-hidden="true">
    <span style="position: absolute; left: 0; top: 0; width: 36px; height: 36px; border-left: 4px solid #F4B740; border-top: 4px solid #F4B740; border-radius: 12px 0 0 0"></span>
    <span style="position: absolute; right: 0; top: 0; width: 36px; height: 36px; border-right: 4px solid #F4B740; border-top: 4px solid #F4B740; border-radius: 0 12px 0 0"></span>
    <span style="position: absolute; left: 0; bottom: 0; width: 36px; height: 36px; border-left: 4px solid #F4B740; border-bottom: 4px solid #F4B740; border-radius: 0 0 0 12px"></span>
    <span style="position: absolute; right: 0; bottom: 0; width: 36px; height: 36px; border-right: 4px solid #F4B740; border-bottom: 4px solid #F4B740; border-radius: 0 0 12px 0"></span>
    <span style="position: absolute; left: 12px; right: 12px; top: 150px; height: 2px; background: #F4B740; box-shadow: 0 0 14px 2px rgba(244,183,64,0.6)"></span>
  </div>

  <sc-for list="{{ tags }}" as="t" hint-placeholder-count="6">
    <span style="{{ t.style }}">
      <span style="{{ t.dot }}"></span>{{ t.name }}
    </span>
  </sc-for>

  <div style="position: absolute; left: 0; right: 0; top: 448px; display: flex; align-items: center; justify-content: center; gap: 44px">
    <button aria-label="Gallery se photo" style="width: 48px; height: 48px; border-radius: 14px; border: 2px solid #FFF6E5; background: #3A1E18; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFF6E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
    </button>
    <button aria-label="Photo lo" style="width: 74px; height: 74px; border-radius: 50%; border: 5px solid #FFF6E5; background: #C8161D; box-shadow: 0 0 0 4px rgba(200,22,29,0.4)"></button>
    <button aria-label="Camera palto" style="width: 48px; height: 48px; border-radius: 14px; border: none; background: #3A1E18; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFF6E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3"/><path d="M5 3v5h5M19 21v-5h-5"/></svg>
    </button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: #FFF6E5; color: #2B0F0B; border-radius: 30px 30px 0 0; padding: 20px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800; line-height: 1">6 cheezein mili</h1>
      <span style="font-size: 13px; font-weight: 700; color: #6B4A40">Tap to edit</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; background: #E7F4EC; color: #1E6B3A; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center">Paneer</span>
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; background: #E7F4EC; color: #1E6B3A; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center">Tamatar</span>
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; background: #E7F4EC; color: #1E6B3A; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center">Pyaaz</span>
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; background: #E7F4EC; color: #1E6B3A; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center">Anda ×4</span>
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; background: #E7F4EC; color: #1E6B3A; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center">Shimla mirch</span>
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; border: 2px dashed #E8A93A; color: #8A5A12; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center">Dahi?</span>
    </div>
    <div style="height: 48px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 0 #EADBC0; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 14px; color: #6B4A40">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C8161D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      Kuch aur hai? Bolo ya likho
    </div>
    <a href="Recipe.dc.html" style="margin-top: auto; height: 56px; border-radius: 18px; background: #C8161D; color: #FFFFFF; font-size: 16px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 0 #7A0A10">
      5 recipes dikhao
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var tag = function (name, x, y, sure) {
      return {
        name: name,
        style: 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; height: 32px; padding: 0 12px 0 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; ' +
          (sure ? 'background: #FFF6E5; color: #2B0F0B; box-shadow: 0 4px 10px rgba(0,0,0,0.35);' : 'background: rgba(22,6,4,0.75); color: #F4B740; border: 1.5px dashed #F4B740;'),
        dot: 'width: 10px; height: 10px; border-radius: 50%; ' + (sure ? 'background: #1E8E3E;' : 'background: #F4B740;')
      };
    };
    return {
      tags: [
        tag('Paneer', 58, 128, true),
        tag('Tamatar', 220, 150, true),
        tag('Pyaaz', 96, 214, true),
        tag('Anda ×4', 236, 262, true),
        tag('Shimla mirch', 50, 318, true),
        tag('Dahi?', 228, 360, false)
      ]
    };
  }
}
</script>
</body>
</html>
