<!doctype html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8">
<title>Kya Khaun — Plan my day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#8E0E14}a:hover{color:#C8161D}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF6E5; font-family: 'Figtree', sans-serif; color: #2B0F0B">

  <div style="position: absolute; left: 24px; right: 24px; top: 22px; display: flex; align-items: flex-end; justify-content: space-between">
    <div>
      <p style="margin: 0; font-size: 14px; font-weight: 700; color: #6B4A40">Shanivaar, 4 Oct</p>
      <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 40px; font-weight: 800; line-height: 1">Aaj ka dabba</h1>
    </div>
    <button aria-label="Poora din dobara banao" style="width: 48px; height: 48px; border-radius: 16px; border: none; background: #2B0F0B; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4B740" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3"/><path d="M5 3v5h5M19 21v-5h-5"/></svg>
    </button>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 106px; display: flex; align-items: center; gap: 10px">
    <div style="flex: 1; height: 12px; border-radius: 6px; background: #EFE2C8; overflow: hidden; display: flex">
      <div style="width: 47%; background: #1E6B3A"></div>
    </div>
    <span style="font-size: 14px; font-weight: 800">₹420 <span style="color: #6B4A40; font-weight: 600">/ ₹900</span></span>
  </div>

  <svg style="position: absolute; left: 125px; top: 132px" width="140" height="46" viewBox="0 0 140 46" fill="none" aria-hidden="true"><path d="M14 46V30C14 14 40 6 70 6s56 8 56 24v16" stroke="#8A5A12" stroke-width="8" stroke-linecap="round"/></svg>
  <div style="position: absolute; left: 22px; top: 176px; width: 9px; height: 484px; border-radius: 5px; background: #8A5A12"></div>
  <div style="position: absolute; right: 22px; top: 176px; width: 9px; height: 484px; border-radius: 5px; background: #8A5A12"></div>

  <div style="position: absolute; left: 36px; right: 36px; top: 168px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{ meals }}" as="m" hint-placeholder-count="4">
      <div style="{{ m.box }}">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="{{ m.kicker }}">{{ m.slot }} · {{ m.time }}</span>
          <span style="{{ m.pill }}">{{ m.mode }}</span>
        </div>
        <div style="font-family: 'Baloo 2', sans-serif; font-size: 25px; font-weight: 800; line-height: 1.05">{{ m.dish }}</div>
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="{{ m.meta }}">{{ m.info }}</span>
          <button aria-label="{{ m.swapLabel }}" style="{{ m.swap }}">Badlo</button>
        </div>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 68px; background: #2B0F0B; border-radius: 24px; display: flex; align-items: center; justify-content: space-around; padding: 0 8px; box-shadow: 0 12px 24px rgba(43,15,11,0.25)">
    <a href="Home.dc.html" aria-label="Home" style="width: 48px; height: 46px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F7E6C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    </a>
    <a href="Chat.dc.html" aria-label="Chats" style="width: 48px; height: 46px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F7E6C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
    </a>
    <a href="Plan.dc.html" aria-current="page" style="height: 46px; padding: 0 16px; border-radius: 16px; background: #F4B740; color: #2B0F0B; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B0F0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="7" width="14" height="5" rx="1.5"/><rect x="5" y="14" width="14" height="5" rx="1.5"/><path d="M8 7V4.5h8V7"/></svg>Plan
    </a>
    <a href="Memory.dc.html" aria-label="Meri pasand" style="width: 48px; height: 46px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F7E6C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var themes = {
      gold: { bg: '#FFE3A3', fg: '#2B0F0B', sub: '#5A3A10', pillBg: '#2B0F0B', pillFg: '#F4B740', swapBg: '#FFF6E5', swapFg: '#2B0F0B' },
      red: { bg: '#C8161D', fg: '#FFF6E5', sub: '#FFE1D6', pillBg: '#F4B740', pillFg: '#2B0F0B', swapBg: '#8E0E14', swapFg: '#FFF6E5' },
      cream: { bg: '#FFFFFF', fg: '#2B0F0B', sub: '#6B4A40', pillBg: '#C8161D', pillFg: '#FFFFFF', swapBg: '#FFF0EC', swapFg: '#8E0E14' },
      ink: { bg: '#2B0F0B', fg: '#FFF6E5', sub: '#E9CFAE', pillBg: '#F4B740', pillFg: '#2B0F0B', swapBg: '#4A1A12', swapFg: '#F4B740' }
    };
    var meal = function (slot, time, dish, mode, info, t) {
      var c = themes[t];
      return {
        slot: slot, time: time, dish: dish, mode: mode, info: info, swapLabel: 'Badlo ' + slot,
        box: 'height: 112px; border-radius: 20px; padding: 12px 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; background: ' + c.bg + '; color: ' + c.fg + '; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.12);',
        kicker: 'font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: ' + c.sub + ';',
        pill: 'height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; background: ' + c.pillBg + '; color: ' + c.pillFg + ';',
        meta: 'font-size: 13px; font-weight: 600; color: ' + c.sub + ';',
        swap: 'height: 30px; padding: 0 12px; border-radius: 10px; border: none; font-size: 13px; font-weight: 800; background: ' + c.swapBg + '; color: ' + c.swapFg + ';'
      };
    };
    return {
      meals: [
        meal('Nashta', '8:30', 'Kanda poha + chai', 'COOK', '15 min · ghar ka saamaan', 'gold'),
        meal('Lunch', '1:30', 'Rajma chawal', 'ORDER', 'Dilli Rasoi, Andheri · ₹220', 'red'),
        meal('Snack', '5:00', 'Vada pav ×2', 'ORDER', 'Station Corner Stall · ₹60', 'cream'),
        meal('Dinner', '9:00', 'Paneer bhurji + roti', 'COOK', '20 min · paneer fridge mein hai', 'ink')
      ]
    };
  }
}
</script>
</body>
</html>
