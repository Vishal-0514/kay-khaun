<!doctype html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8">
<title>Kya Khaun — Taste profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#8E0E14}a:hover{color:#C8161D}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF6E5; font-family: 'Figtree', sans-serif; color: #2B0F0B; padding: 20px 24px 0; box-sizing: border-box">

  <div style="display: flex; align-items: center; gap: 14px; height: 44px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #EADBC0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B0F0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div style="flex: 1; display: flex; gap: 6px" aria-label="Step 2 of 4">
      <div style="flex: 1; height: 6px; border-radius: 3px; background: #C8161D"></div>
      <div style="flex: 1; height: 6px; border-radius: 3px; background: #C8161D"></div>
      <div style="flex: 1; height: 6px; border-radius: 3px; background: #EADBC0"></div>
      <div style="flex: 1; height: 6px; border-radius: 3px; background: #EADBC0"></div>
    </div>
    <a href="Home.dc.html" style="font-size: 15px; font-weight: 700; color: #6B4A40; text-decoration: none; padding: 12px 4px">Skip</a>
  </div>

  <h1 style="margin: 20px 0 4px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.05">Apna swaad batao</h1>
  <p style="margin: 0; font-size: 15px; color: #6B4A40">Jitna main jaanunga, utne kam sawaal puchunga.</p>

  <h2 style="margin: 24px 0 10px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #8A5A12">Khaana</h2>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <button onClick="{{ pickVeg }}" aria-pressed="{{ vegSel }}" style="{{ vegStyle }}">
      <span style="width: 22px; height: 22px; border: 2px solid #1E8E3E; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box"><span style="width: 10px; height: 10px; border-radius: 50%; background: #1E8E3E"></span></span>
      <span style="font-family: 'Baloo 2', sans-serif; font-size: 19px; font-weight: 700; line-height: 1">Veg</span>
      <span style="font-size: 12px; color: #6B4A40">Sirf shakahari</span>
    </button>
    <button onClick="{{ pickNonveg }}" aria-pressed="{{ nonvegSel }}" style="{{ nonvegStyle }}">
      <span style="width: 22px; height: 22px; border: 2px solid #8B3A1A; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="11" height="10" viewBox="0 0 8 7" aria-hidden="true"><path d="M4 0l4 7H0z" fill="#8B3A1A"/></svg></span>
      <span style="font-family: 'Baloo 2', sans-serif; font-size: 19px; font-weight: 700; line-height: 1">Non-veg</span>
      <span style="font-size: 12px; color: #6B4A40">Sab chalega</span>
    </button>
    <button onClick="{{ pickEgg }}" aria-pressed="{{ eggSel }}" style="{{ eggStyle }}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A5A12" stroke-width="2" aria-hidden="true"><path d="M12 3c-4 0-7 6-7 11a7 7 0 0 0 14 0c0-5-3-11-7-11z"/></svg>
      <span style="font-family: 'Baloo 2', sans-serif; font-size: 19px; font-weight: 700; line-height: 1">Egg</span>
      <span style="font-size: 12px; color: #6B4A40">Anda chalega</span>
    </button>
  </div>

  <h2 style="margin: 22px 0 10px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #8A5A12">Mirchi meter</h2>
  <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; box-shadow: 0 3px 0 #EADBC0; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <sc-for list="{{ chilies }}" as="c" hint-placeholder-count="5">
        <button onClick="{{ c.pick }}" aria-label="{{ c.label }}" style="width: 52px; height: 52px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="{{ c.fill }}" stroke="{{ c.stroke }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21c-1.5 0-2-1.5-1-3 3-4 7-6 9-10 .8-1.6 2.4-2.4 4-2 1.6.5 2.3 2.2 1.8 3.8C18 15 12 21 6 21z"/><path d="M17 6c0-2 1-3 3-3" fill="none" stroke="#1E8E3E"/></svg>
        </button>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 12px; color: #6B4A40">Phika</span>
      <span style="font-family: 'Baloo 2', sans-serif; font-size: 18px; font-weight: 700; color: #C8161D">{{ spiceLabel }}</span>
      <span style="font-size: 12px; color: #6B4A40">Aag</span>
    </div>
  </div>

  <h2 style="margin: 22px 0 10px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #8A5A12">Yeh nahi chahiye</h2>
  <div style="display: flex; flex-wrap: wrap; gap: 8px">
    <span style="height: 40px; padding: 0 8px 0 14px; border-radius: 999px; background: #2B0F0B; color: #FFF6E5; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px">Mushroom <button aria-label="Remove mushroom" style="width: 28px; height: 28px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F4B740" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
    <span style="height: 40px; padding: 0 8px 0 14px; border-radius: 999px; background: #2B0F0B; color: #FFF6E5; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px">Karela <button aria-label="Remove karela" style="width: 28px; height: 28px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F4B740" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
    <span style="height: 40px; padding: 0 8px 0 14px; border-radius: 999px; background: #2B0F0B; color: #FFF6E5; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px">Baingan <button aria-label="Remove baingan" style="width: 28px; height: 28px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F4B740" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
    <button style="height: 40px; padding: 0 16px; border-radius: 999px; background: transparent; border: 2px dashed #C9B48F; color: #6B4A40; font-size: 14px; font-weight: 700">+ Add</button>
  </div>

  <h2 style="margin: 22px 0 10px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #8A5A12">Usual budget, ek meal ka</h2>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{ budgets }}" as="b" hint-placeholder-count="3">
      <button onClick="{{ b.pick }}" aria-pressed="{{ b.sel }}" style="{{ b.style }}">
        <span style="{{ b.innerStyle }}">{{ b.label }}</span>
      </button>
    </sc-for>
  </div>

  <a href="Home.dc.html" style="position: absolute; left: 24px; right: 24px; bottom: 24px; height: 58px; border-radius: 18px; background: #C8161D; color: #FFFFFF; font-size: 17px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 0 #7A0A10">
    Aage chalein
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { diet: 'nonveg', spice: 3, budget: 'mid' };
  }
  dietStyle(id) {
    var on = this.state.diet === id;
    return 'height: 112px; border-radius: 20px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #2B0F0B; ' +
      (on ? 'background: #FFF0EC; border: 2.5px solid #C8161D; box-shadow: 0 3px 0 #C8161D;' : 'background: #FFFFFF; border: 2.5px solid #EADBC0; box-shadow: 0 3px 0 #EADBC0;');
  }
  renderVals() {
    var self = this;
    var labels = ['Bilkul phika', 'Halka', 'Medium teekha', 'Teekha', 'Aag laga do!'];
    var chilies = [1, 2, 3, 4, 5].map(function (n) {
      var on = n <= self.state.spice;
      return { label: 'Spice level ' + n, fill: on ? '#C8161D' : 'none', stroke: on ? '#8E0E14' : '#C9B48F', pick: function () { self.setState({ spice: n }); } };
    });
    var budgetDefs = [{ id: 'low', label: '₹150–300' }, { id: 'mid', label: '₹300–500' }, { id: 'high', label: '₹500+' }];
    var budgets = budgetDefs.map(function (b) {
      var on = self.state.budget === b.id;
      return {
        label: b.label,
        sel: on,
        pick: function () { self.setState({ budget: b.id }); },
        style: 'height: 52px; border-radius: 12px; padding: 5px; border: none; ' + (on ? 'background: #1E6B3A;' : 'background: #FFFFFF; box-shadow: 0 3px 0 #EADBC0;'),
        innerStyle: 'height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; ' + (on ? 'border: 1.5px dashed #B9E4C7; color: #FFFFFF;' : 'border: 1.5px dashed #D9C6A3; color: #2B0F0B;')
      };
    });
    return {
      vegStyle: this.dietStyle('veg'), nonvegStyle: this.dietStyle('nonveg'), eggStyle: this.dietStyle('egg'),
      vegSel: this.state.diet === 'veg', nonvegSel: this.state.diet === 'nonveg', eggSel: this.state.diet === 'egg',
      pickVeg: function () { self.setState({ diet: 'veg' }); },
      pickNonveg: function () { self.setState({ diet: 'nonveg' }); },
      pickEgg: function () { self.setState({ diet: 'egg' }); },
      chilies: chilies,
      spiceLabel: labels[this.state.spice - 1],
      budgets: budgets
    };
  }
}
</script>
</body>
</html>
