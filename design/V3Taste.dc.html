<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kya Khaun — Your taste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
a{color:#8E0E14}a:hover{color:#C8161D}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF6E5; font-family: 'Figtree', sans-serif; color: #2B0F0B">

  <div style="position: absolute; left: 20px; right: 20px; top: 20px; display: flex; align-items: center; gap: 12px">
    <a href="V3Login.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; border: 1px solid #F1E4CC; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(90,8,12,0.08)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B0F0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 700; color: #6B4A40">Step 2 of 3</span>
      <div style="height: 6px; border-radius: 3px; background: #EFE2C8"><div style="width: 66%; height: 100%; border-radius: 3px; background: #C8161D"></div></div>
    </div>
    <a href="V3Home.dc.html" style="font-size: 15px; font-weight: 700; color: #6B4A40; text-decoration: none; padding: 12px 4px">Skip</a>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 80px">
    <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 30px; font-weight: 800; line-height: 1.1">Tell us your taste</h1>
    <p style="margin: 2px 0 0; font-size: 14px; color: #6B4A40">The more we know, the fewer questions we ask.</p>

    <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8A5A12; margin-top: 20px">Diet</div>
    <div style="margin-top: 8px; height: 52px; border-radius: 16px; background: #FFFFFF; border: 1px solid #F1E4CC; padding: 4px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
      <button onClick="{{ pickVeg }}" aria-pressed="{{ vegSel }}" style="{{ vegStyle }}"><span style="width: 14px; height: 14px; border: 1.6px solid #1E8E3E; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; flex-shrink: 0; background: #FFFFFF"><span style="width: 6px; height: 6px; border-radius: 50%; background: #1E8E3E"></span></span> Veg</button>
      <button onClick="{{ pickNonveg }}" aria-pressed="{{ nonvegSel }}" style="{{ nonvegStyle }}"><span style="width: 14px; height: 14px; border: 1.6px solid #8B3A1A; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; flex-shrink: 0; background: #FFFFFF"><svg width="8" height="7" viewBox="0 0 8 7" aria-hidden="true"><path d="M4 0l4 7H0z" fill="#8B3A1A"/></svg></span> Non-veg</button>
      <button onClick="{{ pickEgg }}" aria-pressed="{{ eggSel }}" style="{{ eggStyle }}">Egg only</button>
    </div>

    <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: baseline"><div style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8A5A12; ">Spice level</div><span style="font-family: 'Baloo 2', sans-serif; font-size: 17px; font-weight: 700; color: #C8161D">{{ spiceLabel }}</span></div>
    <div style="position: relative; margin-top: 10px; height: 44px">
      <div style="position: absolute; left: 14px; right: 14px; top: 19px; height: 6px; border-radius: 3px; background: #EFE2C8"></div>
      <div style="{{ fillStyle }}"></div>
      <div style="position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between">
        <sc-for list="{{ stops }}" as="s" hint-placeholder-count="5">
          <button onClick="{{ s.pick }}" aria-label="{{ s.label }}" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="{{ s.dot }}"></span></button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #6B4A40; padding: 0 6px"><span>Mild</span><span>Medium</span><span>Extra hot</span></div>

    <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8A5A12; margin-top: 18px">Favourite cuisines</div>
    <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <button onClick="{{ north.pick }}" aria-pressed="{{ north.sel }}" style="position: relative; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #2B0F0B">
        <span style="{{ north.ring }}"><img src="/_blob/148fa86b4e47db21b300f5abc103c207" alt="" style="width: 66px; height: 66px"></span>
        <span style="font-size: 13px; font-weight: 700">North Indian</span>
        <sc-if value="{{ north.sel }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 18px; top: 0; width: 22px; height: 22px; border-radius: 50%; background: #C8161D; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></sc-if>
      </button>
      <button onClick="{{ biryani.pick }}" aria-pressed="{{ biryani.sel }}" style="position: relative; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #2B0F0B">
        <span style="{{ biryani.ring }}"><img src="/_blob/2f4b9a50bdb01e9f4378ed4751b93746" alt="" style="width: 66px; height: 66px"></span>
        <span style="font-size: 13px; font-weight: 700">Biryani</span>
        <sc-if value="{{ biryani.sel }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 18px; top: 0; width: 22px; height: 22px; border-radius: 50%; background: #C8161D; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></sc-if>
      </button>
      <button onClick="{{ street.pick }}" aria-pressed="{{ street.sel }}" style="position: relative; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #2B0F0B">
        <span style="{{ street.ring }}"><img src="/_blob/31c6934d5f85569b808906ef5d054aab" alt="" style="width: 66px; height: 66px"></span>
        <span style="font-size: 13px; font-weight: 700">Street food</span>
        <sc-if value="{{ street.sel }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 18px; top: 0; width: 22px; height: 22px; border-radius: 50%; background: #C8161D; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></sc-if>
      </button>
      <button onClick="{{ chinese.pick }}" aria-pressed="{{ chinese.sel }}" style="position: relative; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #2B0F0B">
        <span style="{{ chinese.ring }}"><img src="/_blob/cae04178a2a56cc1a28dd8732ddadf75" alt="" style="width: 66px; height: 66px"></span>
        <span style="font-size: 13px; font-weight: 700">Chinese</span>
        <sc-if value="{{ chinese.sel }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 18px; top: 0; width: 22px; height: 22px; border-radius: 50%; background: #C8161D; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></sc-if>
      </button>
      <button onClick="{{ healthy.pick }}" aria-pressed="{{ healthy.sel }}" style="position: relative; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #2B0F0B">
        <span style="{{ healthy.ring }}"><img src="/_blob/7d6d5d811fd63ba3c8adbc179beadceb" alt="" style="width: 66px; height: 66px"></span>
        <span style="font-size: 13px; font-weight: 700">Healthy</span>
        <sc-if value="{{ healthy.sel }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 18px; top: 0; width: 22px; height: 22px; border-radius: 50%; background: #C8161D; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></sc-if>
      </button>
      <button onClick="{{ dessert.pick }}" aria-pressed="{{ dessert.sel }}" style="position: relative; border: none; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #2B0F0B">
        <span style="{{ dessert.ring }}"><img src="/_blob/e808dadf6ac13024253e805a55219fa2" alt="" style="width: 66px; height: 66px"></span>
        <span style="font-size: 13px; font-weight: 700">Desserts</span>
        <sc-if value="{{ dessert.sel }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 18px; top: 0; width: 22px; height: 22px; border-radius: 50%; background: #C8161D; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></sc-if>
      </button>
    </div>

    <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8A5A12; margin-top: 18px">Budget per meal</div>
    <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ budgets }}" as="b" hint-placeholder-count="3">
        <button onClick="{{ b.pick }}" aria-pressed="{{ b.sel }}" style="{{ b.style }}">{{ b.label }}</button>
      </sc-for>
    </div>
  </div>
  <a href="V3Home.dc.html" style="position: absolute; left: 20px; right: 20px; bottom: 24px; height: 56px; border-radius: 16px; background: #C8161D; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 18px rgba(200,22,29,0.3)">Continue <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { diet: 'nonveg', spice: 3, budget: 'mid', cuisines: ['north', 'biryani', 'street'] };
  }
  renderVals() {
    var self = this, st = this.state;
    var seg = function (id) {
      var on = st.diet === id;
      return 'border: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700; ' + (on ? 'background: #2B0F0B; color: #FFF6E5;' : 'background: transparent; color: #2B0F0B;');
    };
    var labels = ['Mild', 'Light', 'Medium', 'Hot', 'Extra hot'];
    var out = {
      vegStyle: seg('veg'), nonvegStyle: seg('nonveg'), eggStyle: seg('egg'),
      vegSel: st.diet === 'veg', nonvegSel: st.diet === 'nonveg', eggSel: st.diet === 'egg',
      pickVeg: function () { self.setState({ diet: 'veg' }); },
      pickNonveg: function () { self.setState({ diet: 'nonveg' }); },
      pickEgg: function () { self.setState({ diet: 'egg' }); },
      spiceLabel: labels[st.spice - 1],
      fillStyle: 'position: absolute; left: 14px; top: 19px; height: 6px; border-radius: 3px; background: #C8161D; width: ' + ((st.spice - 1) * 25) + '%;',
      stops: [1, 2, 3, 4, 5].map(function (n) {
        var cur = n === st.spice, on = n <= st.spice;
        return {
          label: 'Spice ' + labels[n - 1],
          pick: function () { self.setState({ spice: n }); },
          dot: cur ? 'width: 28px; height: 28px; border-radius: 50%; background: #F4B740; border: 4px solid #FFFFFF; box-shadow: 0 3px 10px rgba(90,8,12,0.3);' : 'width: 12px; height: 12px; border-radius: 50%; background: ' + (on ? '#C8161D' : '#E3D2B2') + ';'
        };
      }),
      budgets: [['low', 'Under ₹300'], ['mid', '₹300–500'], ['high', '₹500+']].map(function (b) {
        var on = st.budget === b[0];
        return { label: b[1], sel: on, pick: function () { self.setState({ budget: b[0] }); },
          style: 'height: 46px; border-radius: 14px; font-size: 14px; font-weight: 700; ' + (on ? 'background: #FFE9E3; color: #8E0E14; border: 1.5px solid #C8161D;' : 'background: #FFFFFF; color: #2B0F0B; border: 1px solid #F1E4CC;') };
      })
    };
    ['north', 'biryani', 'street', 'chinese', 'healthy', 'dessert'].forEach(function (id) {
      var on = st.cuisines.indexOf(id) >= 0;
      out[id] = { sel: on,
        pick: function () { var list = self.state.cuisines.slice(); var i = list.indexOf(id); if (i >= 0) list.splice(i, 1); else list.push(id); self.setState({ cuisines: list }); },
        ring: 'width: 78px; height: 78px; border-radius: 50%; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #FFE9E3; box-shadow: 0 0 0 2px #C8161D;' : 'background: #FFFFFF; box-shadow: 0 0 0 1px #F1E4CC;')
      };
    });
    return out;
  }
}
</script>
</body>
</html>
