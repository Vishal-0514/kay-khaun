<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mood: 'spicy' };
  }
  katori(id) {
    var on = this.state.mood === id;
    return 'position: absolute; width: 86px; height: 86px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: \'Baloo 2\', sans-serif; font-size: 15px; font-weight: 700; line-height: 1; padding: 0; ' +
      (on ? 'background: #C8161D; color: #FFFFFF; border: 3px solid #8E0E14; box-shadow: 0 6px 12px rgba(200,22,29,0.35);' : 'background: #FFFFFF; color: #2B0F0B; border: 3px solid #F1D29A; box-shadow: inset 0 -4px 0 #FBE9C6;');
  }
  renderVals() {
    var self = this;
    var pick = function (id) { return function () { self.setState({ mood: id }); }; };
    var m = this.state.mood;
    return {
      spicyStyle: this.katori('spicy'), lightStyle: this.katori('light'), comfortStyle: this.katori('comfort'), streetStyle: this.katori('street'), sweetStyle: this.katori('sweet'),
      spicySel: m === 'spicy', lightSel: m === 'light', comfortSel: m === 'comfort', streetSel: m === 'street', sweetSel: m === 'sweet',
      pickSpicy: pick('spicy'), pickLight: pick('light'), pickComfort: pick('comfort'), pickStreet: pick('street'), pickSweet: pick('sweet')
    };
  }
}
</script>
