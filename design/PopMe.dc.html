</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: true };
  }
  renderVals() {
    var self = this;
    var on = this.state.on;
    return {
      memoryOn: on,
      memoryNote: on ? 'On — roz better picks' : 'Off — kuch yaad nahi',
      toggle: function () { self.setState({ on: !self.state.on }); },
      trackStyle: 'width: 64px; height: 38px; border-radius: 999px; border: 2.5px solid #FFF3D6; padding: 3px; display: flex; ' + (on ? 'background: #1FA855; justify-content: flex-end;' : 'background: #6B6B6B; justify-content: flex-start;')
    };
  }
}
</script>
