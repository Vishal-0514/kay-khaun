<!doctype html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8">
<title>Kya Khaun Pop — Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&amp;family=Shrikhand&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#141414}a:hover{color:#E63B2E}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF3D6; font-family: 'Bricolage Grotesque', sans-serif; color: #141414">

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 86px; padding: 18px 18px 0; box-sizing: border-box; display: flex; align-items: center; gap: 12px; background: #FFD23F; border-bottom: 3px solid #141414">
    <a href="PopHome.dc.html" aria-label="Back" style="width: 46px; height: 46px; border-radius: 14px; background: #FFFFFF; border: 3px solid #141414; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <img src="/_blob/ad4fca12322559de90259cafe63d7e74" alt="" style="width: 46px; height: 46px; border-radius: 14px; border: 3px solid #141414; box-sizing: border-box; object-fit: cover">
    <span style="flex: 1; font-family: 'Shrikhand', serif; font-size: 24px; line-height: 1">Chatora</span>
    <button aria-label="Voice replies on" style="width: 46px; height: 46px; border-radius: 14px; background: #141414; border: 3px solid #141414; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFD23F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
  </header>

  <div style="position: absolute; left: 16px; right: 16px; top: 106px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: flex-end; max-width: 270px; background: #FF7AB6; border: 3px solid #141414; box-shadow: 3px 3px 0 #141414; border-radius: 22px 22px 6px 22px; padding: 12px 16px; font-size: 18px; font-weight: 700; line-height: 1.3">Kuch teekha, 400 tak, jaldi!</div>

    <div style="align-self: flex-start; display: flex; flex-wrap: wrap; gap: 8px; max-width: 320px">
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; background: #E63B2E; border: 2.5px solid #141414; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center">Teekha</span>
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; border: 2.5px solid #141414; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center">Non-veg</span>
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; background: #1FA855; border: 2.5px solid #141414; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center">₹400</span>
      <span style="height: 34px; padding: 0 12px; border-radius: 999px; background: #FFD23F; border: 2.5px solid #141414; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center">30 min</span>
    </div>

    <div style="align-self: flex-start; background: #FFFFFF; border: 3px solid #141414; box-shadow: 3px 3px 0 #141414; border-radius: 22px 22px 22px 6px; padding: 12px 18px">
      <span style="font-family: 'Shrikhand', serif; font-size: 26px; line-height: 1.1">Order ya ghar pe?</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 4px">
      <a href="PopPicks.dc.html" style="height: 200px; border-radius: 26px; background: #FFD23F; border: 3px solid #141414; box-shadow: 5px 5px 0 #141414; box-sizing: border-box; text-decoration: none; color: #141414; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transform: rotate(-2deg)">
        <img src="/_blob/1f869fadf0a93381e4a457e0f2c409de" alt="" style="width: 112px; height: 112px">
        <span style="font-family: 'Shrikhand', serif; font-size: 26px; line-height: 1">Order</span>
      </a>
      <a href="PopFridge.dc.html" style="height: 200px; border-radius: 26px; background: #1FA855; border: 3px solid #141414; box-shadow: 5px 5px 0 #141414; box-sizing: border-box; text-decoration: none; color: #141414; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transform: rotate(2deg)">
        <img src="/_blob/62eb1acdeba951a637284b63b4d5ce07" alt="" style="width: 112px; height: 112px">
        <span style="font-family: 'Shrikhand', serif; font-size: 26px; line-height: 1">Ghar pe</span>
      </a>
    </div>
  </div>

  <div style="position: absolute; left: 14px; right: 14px; bottom: 16px; height: 96px; border-radius: 28px; background: #141414; padding: 0 14px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; box-shadow: 4px 4px 0 #E63B2E">
    <button aria-label="Switch to keyboard" style="width: 50px; height: 50px; border-radius: 16px; border: 2.5px solid #FFF3D6; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFF3D6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
    </button>
    <div style="flex: 1; height: 56px; display: flex; align-items: center; justify-content: space-between" aria-hidden="true">
      <sc-for list="{{ bars }}" as="b" hint-placeholder-count="18">
        <span style="{{ b.style }}"></span>
      </sc-for>
    </div>
    <button aria-label="Stop listening" style="width: 62px; height: 62px; border-radius: 50%; border: 3px solid #FFF3D6; background: #E63B2E; display: flex; align-items: center; justify-content: center">
      <span style="width: 18px; height: 18px; border-radius: 4px; background: #FFF3D6"></span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var h = [14, 28, 44, 30, 52, 36, 20, 46, 56, 32, 22, 44, 30, 50, 26, 16, 28, 12];
    var colors = ['#FFD23F', '#FF7AB6', '#1FA855', '#E63B2E'];
    return {
      bars: h.map(function (v, i) {
        return { style: 'width: 7px; border-radius: 4px; height: ' + v + 'px; background: ' + colors[i % 4] + ';' };
      })
    };
  }
}
</script>
</body>
</html>
