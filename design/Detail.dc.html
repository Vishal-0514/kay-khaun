<!doctype html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8">
<title>Kya Khaun — Why I picked this</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#8E0E14}a:hover{color:#C8161D}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF6E5; font-family: 'Figtree', sans-serif; color: #2B0F0B">

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 236px; background: #C8161D; overflow: hidden">
    <div style="position: absolute; right: -70px; top: -40px; width: 240px; height: 240px; border-radius: 50%; border: 18px solid #B01219"></div>
    <div style="position: absolute; right: -20px; top: 10px; width: 140px; height: 140px; border-radius: 50%; border: 2px dashed #E04A4F"></div>
    <a href="Results.dc.html" aria-label="Back" style="position: absolute; left: 20px; top: 20px; width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B0F0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div style="position: absolute; right: 24px; top: 22px; width: 84px; height: 84px; border-radius: 50%; background: #F4B740; transform: rotate(-10deg); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 6px 0 #B7791F">
      <span style="font-size: 10px; font-weight: 800; letter-spacing: 0.08em; color: #5A3A10">SIRF</span>
      <span style="font-family: 'Baloo 2', sans-serif; font-size: 26px; font-weight: 800; line-height: 1; color: #2B0F0B">₹249</span>
    </div>
    <div style="position: absolute; left: 24px; right: 24px; bottom: 22px">
      <div style="font-size: 13px; font-weight: 700; color: #FFE1D6">Khau Galli Grill · Andheri W · 1.8 km</div>
      <h1 style="margin: 4px 0 0; font-family: 'Baloo 2', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.95; color: #FFF6E5">Chicken Tikka<br>Kathi Roll</h1>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 252px">
    <h2 style="margin: 0 0 10px; font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800; line-height: 1">Kyun yeh pick kiya?</h2>
    <div style="background: #FFFFFF; border-radius: 22px; padding: 16px; box-shadow: 0 3px 0 #EADBC0; display: flex; flex-direction: column; gap: 14px">
      <sc-for list="{{ fits }}" as="f" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <span style="font-size: 14px; font-weight: 800">{{ f.label }}</span>
            <span style="font-size: 13px; font-weight: 600; color: #6B4A40">{{ f.note }}</span>
          </div>
          <div style="height: 10px; border-radius: 5px; background: #F3E7D0; overflow: hidden">
            <div style="{{ f.bar }}"></div>
          </div>
        </div>
      </sc-for>
    </div>

    <h3 style="margin: 18px 0 8px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #8A5A12">Andar kya hai</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #EADBC0; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center">Chicken tikka</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #EADBC0; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center">Pudina chutney</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #EADBC0; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center">Laccha pyaaz</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #EADBC0; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center">Rumali roti</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 190px; background: #2B0F0B; border-radius: 30px 30px 0 0; padding: 20px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Baloo 2', sans-serif; font-size: 21px; font-weight: 700; color: #FFF6E5; line-height: 1">Order karne ke liye ready?</span>
      <span style="display: flex; gap: 6px">
        <button aria-label="Good pick" style="width: 40px; height: 40px; border-radius: 12px; border: none; background: #4A1A12; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4B740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v11H4V10zM7 10l4-7c1.5 0 2.5 1 2.5 2.5L13 9h6a2 2 0 0 1 2 2.3l-1.3 7.5A2 2 0 0 1 17.7 21H7"/></svg>
        </button>
        <button aria-label="Not for me" style="width: 40px; height: 40px; border-radius: 12px; border: none; background: #4A1A12; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7E6C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 14V3h3v11zM17 14l-4 7c-1.5 0-2.5-1-2.5-2.5L11 15H5a2 2 0 0 1-2-2.3l1.3-7.5A2 2 0 0 1 6.3 3H17"/></svg>
        </button>
      </span>
    </div>
    <a href="#partner" style="height: 56px; border-radius: 18px; background: #F4B740; color: #2B0F0B; font-size: 16px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 3px 0 #B7791F">
      Continue on [Partner app]
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B0F0B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </a>
    <a href="Fridge.dc.html" style="font-size: 14px; font-weight: 700; color: #F7E6C8; text-align: center; text-decoration: underline; text-underline-offset: 3px">Nahi, ghar pe hi bana leta hoon</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var bar = function (pct, color) { return 'height: 100%; border-radius: 5px; width: ' + pct + '%; background: ' + color + ';'; };
    return {
      fits: [
        { label: 'Budget fit', note: '₹249 / ₹400', bar: bar(62, '#1E6B3A') },
        { label: 'Time fit', note: '22 / 30 min', bar: bar(73, '#1E6B3A') },
        { label: 'Swaad match', note: 'Spicy · Tandoori', bar: bar(92, '#C8161D') },
        { label: 'Aapki history', note: 'Tikka 2x is hafte', bar: bar(80, '#E8A93A') }
      ]
    };
  }
}
</script>
</body>
</html>
